<!doctype html>
<html lang="{{ lang }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ea580c">
    <meta name="mobile-web-app-capable" content="yes">
    <title>{% block title %}{% endblock %} · Daily Report HRGA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/admin-lte/adminlte.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="bg-body-tertiary">
<div class="container py-5" style="max-width: 560px">
    <h1 class="h4 mb-3">{% block heading %}{% endblock %}</h1>
    {% block content %}{% endblock %}
</div>
</body>
</html>
